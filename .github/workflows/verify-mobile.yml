name: Verify NutriCost Mobile
on:
  push:
    branches: [main, codex/nutricost-20261102]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NC_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/mobile-release.cjs
      - name: Wait for production Pages files
        if: github.ref == 'refs/heads/main'
        run: node tests/wait-pages.cjs
      - name: Verify deployed production in an isolated browser
        if: github.ref == 'refs/heads/main'
        env:
          NUTRICOST_URL: https://fonglove41360-create.github.io/nutricost-mobile/?verify=20261102
        run: node tests/mobile-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots-${{ matrix.browser }}
          path: test-results/
