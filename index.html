<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1422"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>NutriCost Mobile</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf6f3;background:#0b1422}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}button,input,select{font:inherit}button{cursor:pointer}header{padding:25px 18px 10px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px}h2{font-size:19px;margin:8px 0 15px}.muted{color:#9bb0b8;font-size:13px}.brand{color:#52e3a7}main{padding:0 15px;max-width:680px;margin:auto}.card{background:#16263a;border:1px solid #273b4b;border-radius:17px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#203247;padding:15px;border-radius:14px}.metric b{font-size:23px;display:block;margin:7px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.pill{background:#204b42;color:#6ee7b7;border-radius:20px;padding:5px 10px;font-size:12px}.btn{border:0;background:#37d49b;color:#062b20;font-weight:750;padding:13px 16px;border-radius:12px}.btn.secondary{background:#293d51;color:#e9f4f0}.btn.danger{background:#5e2c39;color:#ffced6}.btn.small{padding:8px 10px;font-size:12px}.full{width:100%}label{display:block;color:#b9c8ce;font-size:13px;margin:11px 0 5px}input,select{width:100%;border:1px solid #405469;background:#0e1d2d;color:white;padding:12px;border-radius:10px;min-height:43px}input[type=date]{color-scheme:dark}.list{display:flex;flex-direction:column;gap:9px}.item{padding:13px;background:#1b2d41;border-radius:12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#101d2d;border-top:1px solid #304354;display:flex;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:4}.tabs button{flex:1;border:0;background:none;color:#91a9b3;font-size:12px;padding:8px 0}.tabs button.active{color:#5fe5ac;font-weight:bold}.hidden{display:none}.progress{height:8px;background:#33495b;border-radius:10px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#37d49b}.notice{padding:12px;border-radius:12px;background:#423728;color:#ffda8a;font-size:13px;margin:10px 0}.chip{padding:8px;border:1px solid #456274;border-radius:10px;background:#20354a;color:#fff}.chip.active{background:#24684f}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;color:#92a7b1;padding:25px 8px}.sub{font-size:12px;color:#9fb4bf}.divider{border-top:1px solid #31485a;margin:12px 0}summary{cursor:pointer;color:#69e8b4}strong{overflow-wrap:anywhere}
</style></head><body><header><div><div class="muted">PERSONAL NUTRITION</div><h1>🌿 Nutri<span class="brand">Cost</span></h1></div><span class="pill">On-device</span></header><main><section id="dashboard"></section><section id="meals" class="hidden"></section><section id="inventory" class="hidden"></section><section id="catalog" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button data-tab="dashboard" class="active">◫<br>ภาพรวม</button><button data-tab="meals">✚<br>มื้ออาหาร</button><button data-tab="inventory">▣<br>คลัง</button><button data-tab="catalog">⌕<br>วัตถุดิบ</button><button data-tab="settings">⚙<br>ตั้งค่า</button></nav><script>
'use strict';const KEY='nutricost.v1';const groups=['เนื้อสัตว์','ปลาและอาหารทะเล','ไข่','ผัก','ผลไม้','ข้าวและธัญพืช','หัวและอาหารประเภทแป้ง','นมและผลิตภัณฑ์นม','ถั่วและเมล็ดพืช','น้ำมันและไขมัน','เครื่องปรุงและซอส','อื่น ๆ'];const seed=[['เนื้อวัวดรายเอจ','เนื้อสัตว์','g',100,220,20,0,15],['อกไก่ดิบ','เนื้อสัตว์','g',100,120,23,0,2.6],['ไข่ไก่','ไข่','ฟอง',1,72,6.3,.4,4.8],['ไข่เป็ด','ไข่','ฟอง',1,130,9,1,9.6],['มันฝรั่งดิบ','หัวและอาหารประเภทแป้ง','g',100,77,2,17,.1],['บรอกโคลีดิบ','ผัก','g',100,34,2.8,6.6,.4],['ข้าวสารขาว','ข้าวและธัญพืช','g',100,365,7.1,80,.7],['กล้วย','ผลไม้','g',100,89,1.1,22.8,.3],['แซลมอนดิบ','ปลาและอาหารทะเล','g',100,208,20,0,13]];const init=()=>({foods:seed.map((x,i)=>({id:'f'+i,name:x[0],group:x[1],unit:x[2],base:x[3],k:x[4],p:x[5],c:x[6],f:x[7]})),lots:[],meals:[],goals:{k:2200,p:150,c:220,f:70},version:1});let db;try{db=JSON.parse(localStorage.getItem(KEY))||init();if(!Array.isArray(db.foods)||!Array.isArray(db.lots)||!Array.isArray(db.meals))throw Error('Invalid data')}catch(e){db=init();alert('ไม่สามารถอ่านข้อมูลเดิมได้ กรุณานำเข้าไฟล์สำรองหากมี')}let tab='dashboard',selectedGroup='ทั้งหมด',draft=[],mealName='มื้อเช้า',mealDate=localDate(),filterDate=localDate();function localDate(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('บันทึกข้อมูลไม่สำเร็จ พื้นที่เก็บข้อมูลอาจเต็ม');throw e}}function esc(x){return String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}const n=x=>Number(x||0),money=x=>'฿'+n(x).toFixed(2),num=x=>n(x).toLocaleString('th-TH',{maximumFractionDigits:1});const food=id=>db.foods.find(f=>f.id===id),remaining=lot=>Math.max(0,n(lot.qty)-n(lot.used));function stock(id){return db.lots.filter(l=>l.foodId===id).reduce((s,l)=>s+remaining(l),0)}function unit(f){return f?.unit||'g'}function opts(items,selected){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}function show(t){tab=t;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>show(x.dataset.tab));function totals(lines){return lines.reduce((a,x)=>{const f=food(x.foodId);if(!f)return a;const factor=n(x.qty)/n(f.base);for(let k of ['k','p','c','f'])a[k]+=n(f[k])*factor;a.cost+=n(x.cost);return a},{k:0,p:0,c:0,f:0,cost:0})}function render(){({dashboard:drawDashboard,meals:drawMeals,inventory:drawInventory,catalog:drawCatalog,settings:drawSettings})[tab]()}function drawDashboard(){const today=db.meals.filter(m=>m.date===localDate()),lines=today.flatMap(m=>m.lines),t=totals(lines);let cards=[['แคลอรี','k','kcal'],['โปรตีน','p','g'],['คาร์บ','c','g'],['ไขมัน','f','g']];document.getElementById('dashboard').innerHTML=`<h2>ภาพรวมวันนี้ <span class="sub">${localDate()}</span></h2><div class="grid">${cards.map(([title,key,u])=>`<div class="metric"><div class="muted">${title}</div><b>${num(t[key])} <small class="sub">${u}</small></b><div class="sub">เป้าหมาย ${num(db.goals[key])}</div><div class="progress"><span style="width:${Math.min(100,t[key]/(db.goals[key]||1)*100)}%"></span></div></div>`).join('')}</div><div class="card row"><div><div class="muted">ต้นทุนอาหารวันนี้</div><h1 class="brand">${money(t.cost)}</h1></div><button class="btn" onclick="show('meals')">+ เพิ่มมื้อ</button></div><h2>มื้ออาหารวันนี้</h2><div class="list">${today.length?today.map(m=>`<div class="item row"><div><strong>${esc(m.name)}</strong><div class="sub">${m.lines.length} รายการ · ${num(totals(m.lines).k)} kcal</div></div><b>${money(totals(m.lines).cost)}</b></div>`).join(''):'<div class="empty">ยังไม่มีมื้ออาหารวันนี้</div>'}</div><div class="card"><strong>สรุปคลัง</strong><div class="row"><span class="muted">ล็อตที่ยังมีของ</span><b>${db.lots.filter(l=>remaining(l)>0).length}</b></div><div class="row"><span class="muted">ล็อตใกล้หมดอายุ (ภายใน 3 วัน)</span><b>${db.lots.filter(l=>remaining(l)>0&&l.expiry&&((new Date(l.expiry+'T00:00:00')-new Date(localDate()+'T00:00:00'))/86400000)<=3).length}</b></div></div>`}function drawMeals(){let available=db.foods.filter(f=>stock(f.id)>0),chosen=document.getElementById('addFood')?.value||available[0]?.id;const total=totals(draft.map(d=>({...d,cost:estimate(d.foodId,d.qty)})));document.getElementById('meals').innerHTML=`<h2>บันทึกมื้ออาหาร</h2><div class="card"><label>วันที่</label><input id="mealDate" type="date" value="${mealDate}" onchange="mealDate=this.value"><label>มื้อ</label><select id="mealName" onchange="mealName=this.value">${['มื้อเช้า','มื้อกลางวัน','มื้อเย็น','ของว่าง'].map(x=>`<option ${x===mealName?'selected':''}>${x}</option>`).join('')}</select><div class="divider"></div><label>เลือกวัตถุดิบจากคลัง</label><select id="addFood" onchange="updateAvail()">${opts(available,chosen)}</select><div id="avail" class="sub"></div><label>ปริมาณที่กิน (หน่วยตามวัตถุดิบ)</label><input id="eatQty" type="number" min="0.01" step="any" placeholder="เช่น 100"><button class="btn full" style="margin-top:12px" onclick="addDraft()">+ เพิ่มวัตถุดิบในมื้อ</button>${!available.length?'<div class="notice">ยังไม่มีวัตถุดิบในคลัง กรุณาเพิ่มล็อตที่ซื้อก่อน</div>':''}</div><h2>รายการในมื้อนี้</h2><div class="list">${draft.length?draft.map((d,i)=>`<div class="item row"><div><strong>${esc(food(d.foodId)?.name)}</strong><div class="sub">${num(d.qty)} ${esc(unit(food(d.foodId)))} · ${money(estimate(d.foodId,d.qty))}</div></div><button class="btn danger small" onclick="draft.splice(${i},1);drawMeals()">ลบ</button></div>`).join(''):'<div class="empty">เลือกวัตถุดิบด้านบนเพื่อเริ่ม</div>'}</div><div class="card"><strong>รวม ${num(total.k)} kcal</strong><div class="muted">โปรตีน ${num(total.p)}g · คาร์บ ${num(total.c)}g · ไขมัน ${num(total.f)}g</div><h2 class="brand">${money(total.cost)}</h2><button class="btn full" onclick="commitMeal()" ${!draft.length?'disabled':''}>บันทึกมื้อและหักสต็อกอัตโนมัติ</button></div><h2>ประวัติมื้ออาหาร</h2><input type="date" value="${filterDate}" onchange="filterDate=this.value;drawMeals()"><div class="list" style="margin-top:12px">${db.meals.filter(m=>m.date===filterDate).map(m=>`<div class="item"><div class="row"><b>${esc(m.name)}</b><button class="btn danger small" onclick="deleteMeal('${esc(m.id)}')">ลบและคืนสต็อก</button></div><div class="sub">${m.lines.map(l=>esc(food(l.foodId)?.name)+' '+num(l.qty)+unit(food(l.foodId))).join(' · ')}</div><div class="brand">${money(totals(m.lines).cost)}</div></div>`).join('')||'<div class="empty">ไม่มีรายการในวันที่เลือก</div>'}</div>`;updateAvail()}function updateAvail(){const id=document.getElementById('addFood')?.value,f=food(id),el=document.getElementById('avail');if(el)el.textContent=f?`คงเหลือ ${num(stock(id))} ${unit(f)}`:''}function sortedLots(id){return db.lots.filter(l=>l.foodId===id&&remaining(l)>0).sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31')||a.created.localeCompare(b.created))}function estimate(id,qty){let left=qty,cost=0;for(let l of sortedLots(id)){let take=Math.min(left,remaining(l));cost+=take*n(l.price)/n(l.qty);left-=take;if(left<=0)break}return cost}function addDraft(){const id=document.getElementById('addFood').value,qty=n(document.getElementById('eatQty').value);if(!id||!Number.isFinite(qty)||qty<=0)return alert('กรุณาเลือกวัตถุดิบและปริมาณที่ถูกต้อง');const used=draft.filter(x=>x.foodId===id).reduce((s,x)=>s+x.qty,0);if(qty+used>stock(id)+1e-7)return alert('สต็อกไม่เพียงพอ');draft.push({foodId:id,qty});drawMeals()}function commitMeal(){if(!draft.length)return;const requested={};for(let d of draft)requested[d.foodId]=(requested[d.foodId]||0)+d.qty;for(let [id,qty] of Object.entries(requested))if(qty>stock(id)+1e-7)return alert('สต็อกไม่เพียงพอ: '+food(id)?.name);if(!mealDate)return alert('กรุณาเลือกวันที่');const snapshot=JSON.stringify(db);try{let lines=draft.map(d=>{let left=d.qty,allocations=[];for(let l of sortedLots(d.foodId)){let take=Math.min(left,remaining(l));if(take<=0)continue;l.used=n(l.used)+take;allocations.push({lotId:l.id,qty:take,cost:take*l.price/l.qty});left-=take;if(left<1e-7)break}if(left>1e-7)throw Error('สต็อกไม่เพียงพอ');return {...d,cost:allocations.reduce((s,x)=>s+x.cost,0),allocations}});db.meals.push({id:uid(),date:mealDate,name:mealName,lines,created:new Date().toISOString()});save();draft=[];alert('บันทึกมื้ออาหารและหักสต็อกแล้ว');drawMeals()}catch(e){db=JSON.parse(snapshot);alert('บันทึกไม่สำเร็จ: '+e.message)}}function deleteMeal(id){let m=db.meals.find(x=>x.id===id);if(!m||!confirm('ลบมื้อนี้และคืนปริมาณวัตถุดิบเข้าล็อตเดิม?'))return;for(let line of m.lines)for(let a of line.allocations){let l=db.lots.find(x=>x.id===a.lotId);if(l)l.used=Math.max(0,l.used-a.qty)}db.meals=db.meals.filter(x=>x.id!==id);save();drawMeals()}function drawInventory(){document.getElementById('inventory').innerHTML=`<h2>คลังวัตถุดิบ</h2><div class="card"><strong>เพิ่มล็อตที่ซื้อ</strong><label>วัตถุดิบ</label><select id="lotFood">${opts(db.foods)}</select><div class="grid"><div><label>ปริมาณที่ซื้อ</label><input id="lotQty" type="number" step="any" min="0" placeholder="300"></div><div><label>ราคาซื้อ (บาท)</label><input id="lotPrice" type="number" step="any" min="0" placeholder="100"></div></div><label>วันหมดอายุ (ถ้ามี)</label><input id="lotExpiry" type="date"><button class="btn full" style="margin-top:12px" onclick="addLot()">+ บันทึกล็อตใหม่</button></div><h2>ล็อตในคลัง</h2><div class="list">${db.lots.slice().reverse().map(l=>{let f=food(l.foodId),r=remaining(l),pct=l.qty?r/l.qty*100:0;return `<div class="item"><div class="row"><strong>${esc(f?.name||'วัตถุดิบที่ถูกลบ')}</strong><span class="pill">${num(r)} ${esc(unit(f))}</span></div><div class="sub">ซื้อ ${num(l.qty)} ${esc(unit(f))} · ${money(l.price)} · ต้นทุนคงเหลือ ${money(r*l.price/l.qty)}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="row"><span class="sub">หมดอายุ: ${esc(l.expiry||'ไม่ได้ระบุ')}</span><span class="sub">${r===0?'ใช้หมดแล้ว':'คงเหลือ '+num(pct)+'%'}</span></div>${r>0?`<details><summary>ปรับยอด / ทิ้งวัตถุดิบ</summary><label>ปริมาณที่ต้องการตัดออก (${esc(unit(f))})</label><input type="number" id="waste-${esc(l.id)}" min="0" step="any"><button class="btn danger small" onclick="wasteLot('${esc(l.id)}')">ยืนยันตัดออก</button></details>`:''}</div>`}).join('')||'<div class="empty">ยังไม่มีล็อตวัตถุดิบ</div>'}</div>`}function addLot(){const foodId=document.getElementById('lotFood').value,qty=n(document.getElementById('lotQty').value),price=n(document.getElementById('lotPrice').value),expiry=document.getElementById('lotExpiry').value;if(!foodId||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0||document.getElementById('lotPrice').value==='')return alert('กรุณากรอกปริมาณและราคาที่ถูกต้อง');db.lots.push({id:uid(),foodId,qty,price,used:0,expiry,created:new Date().toISOString()});save();drawInventory()}function wasteLot(id){const l=db.lots.find(x=>x.id===id),v=n(document.getElementById('waste-'+id).value);if(!l||v<=0||v>remaining(l))return alert('จำนวนไม่ถูกต้อง');if(!confirm('ตัดวัตถุดิบออกจากคลัง '+num(v)+' หน่วย?'))return;l.used+=v;save();drawInventory()}function drawCatalog(){let filtered=db.foods.filter(f=>selectedGroup==='ทั้งหมด'||f.group===selectedGroup);document.getElementById('catalog').innerHTML=`<h2>ฐานข้อมูลวัตถุดิบ</h2><div class="chips">${['ทั้งหมด',...groups].map(g=>`<button class="chip ${g===selectedGroup?'active':''}" data-group="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="list">${filtered.map(f=>`<div class="item"><div class="row"><strong>${esc(f.name)}</strong><span class="pill">${num(stock(f.id))} ${esc(f.unit)}</span></div><div class="sub">ต่อ ${num(f.base)} ${esc(f.unit)} · ${num(f.k)} kcal · โปรตีน ${num(f.p)}g · คาร์บ ${num(f.c)}g · ไขมัน ${num(f.f)}g</div></div>`).join('')}</div><div class="card"><strong>เพิ่มวัตถุดิบใหม่</strong><label>ชื่อ</label><input id="newName" placeholder="เช่น เนื้อวัวส่วนริบอาย"><label>หมวดหมู่</label><select id="newGroup">${groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><label>หน่วย</label><select id="newUnit"><option value="g">กรัม (g)</option><option value="ฟอง">ฟอง</option><option value="ml">มิลลิลิตร (ml)</option><option value="ชิ้น">ชิ้น</option></select><label>ค่าข้อมูลสารอาหารต่อปริมาณ</label><input id="newBase" type="number" value="100" min="0.01" step="any"><div class="grid">${[['k','แคลอรี (kcal)'],['p','โปรตีน (g)'],['c','คาร์บ (g)'],['f','ไขมัน (g)']].map(([k,label])=>`<div><label>${label}</label><input id="new${k}" type="number" value="0" min="0" step="any"></div>`).join('')}</div><button class="btn full" style="margin-top:12px" onclick="addFood()">+ เพิ่มเข้าฐานข้อมูล</button></div><div class="notice">ค่าทางโภชนาการตั้งต้นเป็นค่าประมาณ โปรดตรวจสอบฉลากหรือฐานข้อมูลอาหารก่อนใช้งานจริง โดยเฉพาะเนื้อดรายเอจ</div>`;document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{selectedGroup=b.dataset.group;drawCatalog()})}function addFood(){const name=document.getElementById('newName').value.trim(),base=n(document.getElementById('newBase').value);let values={};for(let k of ['k','p','c','f'])values[k]=n(document.getElementById('new'+k).value);if(!name||base<=0||Object.values(values).some(v=>v<0||!Number.isFinite(v)))return alert('กรุณากรอกข้อมูลให้ถูกต้อง');db.foods.push({id:uid(),name,group:document.getElementById('newGroup').value,unit:document.getElementById('newUnit').value,base,...values});save();drawCatalog()}function drawSettings(){document.getElementById('settings').innerHTML=`<h2>ตั้งค่าและสำรองข้อมูล</h2><div class="card"><strong>เป้าหมายสารอาหารต่อวัน</strong><div class="grid">${[['k','แคลอรี (kcal)'],['p','โปรตีน (g)'],['c','คาร์บ (g)'],['f','ไขมัน (g)']].map(([k,label])=>`<div><label>${label}</label><input id="goal${k}" type="number" min="0" value="${db.goals[k]}"></div>`).join('')}</div><button class="btn full" style="margin-top:12px" onclick="saveGoals()">บันทึกเป้าหมาย</button></div><div class="card"><strong>สำรองข้อมูล</strong><p class="muted">ดาวน์โหลดไฟล์ JSON ไปเก็บในแอป Files หรือ iCloud Drive เพื่อป้องกันข้อมูลหายเมื่อ Safari ล้างข้อมูลเว็บไซต์</p><button class="btn full" onclick="exportData()">⬇ ส่งออกไฟล์สำรอง</button><label>นำเข้าไฟล์สำรอง (แทนที่ข้อมูลปัจจุบันทั้งหมด)</label><input type="file" id="importFile" accept="application/json,.json" onchange="importData(this)"></div><div class="notice">แอปนี้เก็บข้อมูลไว้ในเบราว์เซอร์ของเครื่องเดียว ไม่มีระบบซิงก์หรือบัญชีผู้ใช้ หากล้างข้อมูล Safari ข้อมูลอาจสูญหาย กรุณาสำรองข้อมูลเป็นระยะ</div><div class="card"><strong>วิธีติดตั้งบน iPhone</strong><p class="muted">เมื่อแอปถูกเผยแพร่ผ่าน HTTPS ให้เปิดใน Safari → กด Share → Add to Home Screen เพื่อเพิ่มไอคอนบนหน้าจอ</p></div>`}function saveGoals(){for(let k of ['k','p','c','f']){let v=n(document.getElementById('goal'+k).value);if(!Number.isFinite(v)||v<0)return alert('เป้าหมายไม่ถูกต้อง');db.goals[k]=v}save();alert('บันทึกเป้าหมายแล้ว')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nutricost-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(el){const f=el.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.foods)||!Array.isArray(obj.lots)||!Array.isArray(obj.meals)||!obj.goals||!obj.foods.every(x=>x.id&&x.name&&x.base>0)||!obj.lots.every(x=>x.id&&x.foodId&&x.qty>0&&x.price>=0&&x.used>=0&&x.used<=x.qty))throw Error('รูปแบบไฟล์ไม่ถูกต้อง');if(!confirm('แทนที่ข้อมูลทั้งหมดด้วยไฟล์สำรองนี้?'))return;db=obj;save();show('dashboard');alert('นำเข้าข้อมูลสำเร็จ')}catch(e){alert('นำเข้าไม่สำเร็จ: '+e.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});show('dashboard');
</script></body></html>
