'use strict';const KEY='nutricost.preview.v2';const groups=['เนื้อสัตว์','ปลาและอาหารทะเล','ไข่','ผัก','ผลไม้','ข้าวและธัญพืช','หัวและอาหารประเภทแป้ง','นมและผลิตภัณฑ์นม','ถั่วและเมล็ดพืช','น้ำมันและไขมัน','เครื่องปรุงและซอส','อื่น ๆ'];const seed=[['เนื้อวัวดรายเอจ','เนื้อสัตว์','g',100,220,20,0,15],['อกไก่ดิบ','เนื้อสัตว์','g',100,120,23,0,2.6],['ไข่ไก่','ไข่','ฟอง',1,72,6.3,.4,4.8],['ไข่เป็ด','ไข่','ฟอง',1,130,9,1,9.6],['มันฝรั่งดิบ','หัวและอาหารประเภทแป้ง','g',100,77,2,17,.1],['บรอกโคลีดิบ','ผัก','g',100,34,2.8,6.6,.4],['ข้าวสารขาว','ข้าวและธัญพืช','g',100,365,7.1,80,.7],['กล้วย','ผลไม้','g',100,89,1.1,22.8,.3],['แซลมอนดิบ','ปลาและอาหารทะเล','g',100,208,20,0,13]];const init=()=>({foods:seed.map((x,i)=>({id:'f'+i,name:x[0],group:x[1],unit:x[2],base:x[3],k:x[4],p:x[5],c:x[6],f:x[7]})),lots:[],meals:[],goals:{k:2200,p:150,c:220,f:70},version:1});let db;try{db=JSON.parse(localStorage.getItem(KEY))||init();if(!Array.isArray(db.foods)||!Array.isArray(db.lots)||!Array.isArray(db.meals))throw Error('Invalid data')}catch(e){db=init();alert('ไม่สามารถอ่านข้อมูลเดิมได้ กรุณานำเข้าไฟล์สำรองหากมี')}let tab='dashboard',selectedGroup='ทั้งหมด',draft=[],mealName='มื้อเช้า',mealDate=localDate(),filterDate=localDate();function localDate(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('บันทึกข้อมูลไม่สำเร็จ พื้นที่เก็บข้อมูลอาจเต็ม');throw e}}function esc(x){return String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}const n=x=>Number(x||0),money=x=>'฿'+n(x).toFixed(2),num=x=>n(x).toLocaleString('th-TH',{maximumFractionDigits:1});const food=id=>db.foods.find(f=>f.id===id),remaining=lot=>Math.max(0,n(lot.qty)-n(lot.used));function stock(id){return db.lots.filter(l=>l.foodId===id).reduce((s,l)=>s+remaining(l),0)}function unit(f){return f?.unit||'g'}function opts(items,selected){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}function show(t){tab=t;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>show(x.dataset.tab));function totals(lines){return lines.reduce((a,x)=>{const f=food(x.foodId);if(!f)return a;const factor=n(x.qty)/n(f.base);for(let k of ['k','p','c','f'])a[k]+=n(f[k])*factor;a.cost+=n(x.cost);return a},{k:0,p:0,c:0,f:0,cost:0})}function render(){({dashboard:drawDashboard,meals:drawMeals,inventory:drawInventory,catalog:drawCatalog,settings:drawSettings})[tab]()}function drawDashboard(){const today=db.meals.filter(m=>m.date===localDate()),lines=today.flatMap(m=>m.lines),t=totals(lines);let cards=[['แคลอรี','k','kcal'],['โปรตีน','p','g'],['คาร์บ','c','g'],['ไขมัน','f','g']];document.getElementById('dashboard').innerHTML=`<h2>ภาพรวมวันนี้ <span class="sub">${localDate()}</span></h2><div class="grid">${cards.map(([title,key,u])=>`<div class="metric"><div class="muted">${title}</div><b>${num(t[key])} <small class="sub">${u}</small></b><div class="sub">เป้าหมาย ${num(db.goals[key])}</div><div class="progress"><span style="width:${Math.min(100,t[key]/(db.goals[key]||1)*100)}%"></span></div></div>`).join('')}</div><div class="card row"><div><div class="muted">ต้นทุนอาหารวันนี้</div><h1 class="brand">${money(t.cost)}</h1></div><button class="btn" onclick="show('meals')">+ เพิ่มมื้อ</button></div><h2>มื้ออาหารวันนี้</h2><div class="list">${today.length?today.map(m=>`<div class="item row"><div><strong>${esc(m.name)}</strong><div class="sub">${m.lines.length} รายการ · ${num(totals(m.lines).k)} kcal</div></div><b>${money(totals(m.lines).cost)}</b></div>`).join(''):'<div class="empty">ยังไม่มีมื้ออาหารวันนี้</div>'}</div><div class="card"><strong>สรุปคลัง</strong><div class="row"><span class="muted">ล็อตที่ยังมีของ</span><b>${db.lots.filter(l=>remaining(l)>0).length}</b></div><div class="row"><span class="muted">ล็อตใกล้หมดอายุ (ภายใน 3 วัน)</span><b>${db.lots.filter(l=>remaining(l)>0&&l.expiry&&((new Date(l.expiry+'T00:00:00')-new Date(localDate()+'T00:00:00'))/86400000)<=3).length}</b></div></div>`}function drawMeals(){let available=db.foods.filter(f=>stock(f.id)>0),chosen=document.getElementById('addFood')?.value||available[0]?.id;const total=totals(draft.map(d=>({...d,cost:estimate(d.foodId,d.qty)})));document.getElementById('meals').innerHTML=`<h2>บันทึกมื้ออาหาร</h2><div class="card"><label>วันที่</label><input id="mealDate" type="date" value="${mealDate}" onchange="mealDate=this.value"><label>มื้อ</label><select id="mealName" onchange="mealName=this.value">${['มื้อเช้า','มื้อกลางวัน','มื้อเย็น','ของว่าง','มื้อ 1','มื้อ 2','มื้อ 3','หลังออกกำลังกาย','กำหนดเอง'].map(x=>`<option ${x===mealName?'selected':''}>${x}</option>`).join('')}</select><label>ชื่อมื้อกำหนดเอง (ถ้าต้องการ)</label><input id="nc-custom-meal" placeholder="เช่น มื้อ 4 / ก่อนออกกำลังกาย" maxlength="70"><div class="divider"></div><label>เลือกวัตถุดิบจากคลัง</label><select id="addFood" onchange="updateAvail()">${opts(available,chosen)}</select><div id="avail" class="sub"></div><label>ปริมาณที่กิน (หน่วยตามวัตถุดิบ)</label><input id="eatQty" type="number" min="0.01" step="any" placeholder="เช่น 100"><button class="btn full" style="margin-top:12px" onclick="addDraft()">+ เพิ่มวัตถุดิบในมื้อ</button>${!available.length?'<div class="notice">ยังไม่มีวัตถุดิบในคลัง กรุณาเพิ่มล็อตที่ซื้อก่อน</div>':''}</div><h2>รายการในมื้อนี้</h2><div class="list">${draft.length?draft.map((d,i)=>`<div class="item row"><div><strong>${esc(food(d.foodId)?.name)}</strong><div class="sub">${num(d.qty)} ${esc(unit(food(d.foodId)))} · ${money(estimate(d.foodId,d.qty))}</div></div><button class="btn danger small" onclick="draft.splice(${i},1);drawMeals()">ลบ</button></div>`).join(''):'<div class="empty">เลือกวัตถุดิบด้านบนเพื่อเริ่ม</div>'}</div><div class="card"><strong>รวม ${num(total.k)} kcal</strong><div class="muted">โปรตีน ${num(total.p)}g · คาร์บ ${num(total.c)}g · ไขมัน ${num(total.f)}g</div><h2 class="brand">${money(total.cost)}</h2><button class="btn full" onclick="commitMeal()" ${!draft.length?'disabled':''}>บันทึกมื้อและหักสต็อกอัตโนมัติ</button></div><h2>ประวัติมื้ออาหาร</h2><input type="date" value="${filterDate}" onchange="filterDate=this.value;drawMeals()"><div class="list" style="margin-top:12px">${db.meals.filter(m=>m.date===filterDate).map(m=>`<div class="item"><div class="row"><b>${esc(m.name)}</b><button class="btn danger small" onclick="deleteMeal('${esc(m.id)}')">ลบและคืนสต็อก</button></div><div class="sub">${m.lines.map(l=>esc(food(l.foodId)?.name)+' '+num(l.qty)+unit(food(l.foodId))).join(' · ')}</div><div class="brand">${money(totals(m.lines).cost)}</div></div>`).join('')||'<div class="empty">ไม่มีรายการในวันที่เลือก</div>'}</div>`;updateAvail()}function updateAvail(){const id=document.getElementById('addFood')?.value,f=food(id),el=document.getElementById('avail');if(el)el.textContent=f?`คงเหลือ ${num(stock(id))} ${unit(f)}`:''}function sortedLots(id){return db.lots.filter(l=>l.foodId===id&&remaining(l)>0).sort((a,b)=>(a.expiry||'9999-12-31').localeCompare(b.expiry||'9999-12-31')||a.created.localeCompare(b.created))}function estimate(id,qty){let left=qty,cost=0;for(let l of sortedLots(id)){let take=Math.min(left,remaining(l));cost+=take*n(l.price)/n(l.qty);left-=take;if(left<=0)break}return cost}function addDraft(){const id=document.getElementById('addFood').value,qty=n(document.getElementById('eatQty').value);if(!id||!Number.isFinite(qty)||qty<=0)return alert('กรุณาเลือกวัตถุดิบและปริมาณที่ถูกต้อง');const used=draft.filter(x=>x.foodId===id).reduce((s,x)=>s+x.qty,0);if(qty+used>stock(id)+1e-7)return alert('สต็อกไม่เพียงพอ');draft.push({foodId:id,qty});drawMeals()}function commitMeal(){const custom=document.getElementById('nc-custom-meal')?.value.trim();if(custom)mealName=custom;else if(mealName==='กำหนดเอง')return alert('กรุณาระบุชื่อมื้อ');if(!draft.length)return;const requested={};for(let d of draft)requested[d.foodId]=(requested[d.foodId]||0)+d.qty;for(let [id,qty] of Object.entries(requested))if(qty>stock(id)+1e-7)return alert('สต็อกไม่เพียงพอ: '+food(id)?.name);if(!mealDate)return alert('กรุณาเลือกวันที่');const snapshot=JSON.stringify(db);try{let lines=draft.map(d=>{let left=d.qty,allocations=[];for(let l of sortedLots(d.foodId)){let take=Math.min(left,remaining(l));if(take<=0)continue;l.used=n(l.used)+take;allocations.push({lotId:l.id,qty:take,cost:take*l.price/l.qty});left-=take;if(left<1e-7)break}if(left>1e-7)throw Error('สต็อกไม่เพียงพอ');return {...d,cost:allocations.reduce((s,x)=>s+x.cost,0),allocations}});db.meals.push({id:uid(),date:mealDate,name:mealName,lines,created:new Date().toISOString()});save();draft=[];alert('บันทึกมื้ออาหารและหักสต็อกแล้ว');drawMeals()}catch(e){db=JSON.parse(snapshot);alert('บันทึกไม่สำเร็จ: '+e.message)}}function deleteMeal(id){let m=db.meals.find(x=>x.id===id);if(!m||!confirm('ลบมื้อนี้และคืนปริมาณวัตถุดิบเข้าล็อตเดิม?'))return;for(let line of m.lines)for(let a of line.allocations){let l=db.lots.find(x=>x.id===a.lotId);if(l)l.used=Math.max(0,l.used-a.qty)}db.meals=db.meals.filter(x=>x.id!==id);save();drawMeals()}function drawInventory(){document.getElementById('inventory').innerHTML=`<h2>คลังวัตถุดิบ</h2><div class="card"><strong>เพิ่มล็อตที่ซื้อ</strong><label>วัตถุดิบ</label><select id="lotFood">${opts(db.foods)}</select><div class="grid"><div><label>ปริมาณที่ซื้อ</label><input id="lotQty" type="number" step="any" min="0" placeholder="300"></div><div><label>ราคาซื้อ (บาท)</label><input id="lotPrice" type="number" step="any" min="0" placeholder="100"></div></div><label>วันหมดอายุ (ถ้ามี)</label><input id="lotExpiry" type="date"><button class="btn full" style="margin-top:12px" onclick="addLot()">+ บันทึกล็อตใหม่</button></div><h2>ล็อตในคลัง</h2><div class="list">${db.lots.slice().reverse().map(l=>{let f=food(l.foodId),r=remaining(l),pct=l.qty?r/l.qty*100:0;return `<div class="item"><div class="row"><strong>${esc(f?.name||'วัตถุดิบที่ถูกลบ')}</strong><span class="pill">${num(r)} ${esc(unit(f))}</span></div><div class="sub">ซื้อ ${num(l.qty)} ${esc(unit(f))} · ${money(l.price)} · ต้นทุนคงเหลือ ${money(r*l.price/l.qty)}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="row"><span class="sub">หมดอายุ: ${esc(l.expiry||'ไม่ได้ระบุ')}</span><span class="sub">${r===0?'ใช้หมดแล้ว':'คงเหลือ '+num(pct)+'%'}</span></div>${r>0?`<details><summary>ปรับยอด / ทิ้งวัตถุดิบ</summary><label>ปริมาณที่ต้องการตัดออก (${esc(unit(f))})</label><input type="number" id="waste-${esc(l.id)}" min="0" step="any"><button class="btn danger small" onclick="wasteLot('${esc(l.id)}')">ยืนยันตัดออก</button></details>`:''}</div>`}).join('')||'<div class="empty">ยังไม่มีล็อตวัตถุดิบ</div>'}</div>`}function addLot(){const foodId=document.getElementById('lotFood').value,qty=n(document.getElementById('lotQty').value),price=n(document.getElementById('lotPrice').value),expiry=document.getElementById('lotExpiry').value;if(!foodId||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0||document.getElementById('lotPrice').value==='')return alert('กรุณากรอกปริมาณและราคาที่ถูกต้อง');db.lots.push({id:uid(),foodId,qty,price,used:0,expiry,created:new Date().toISOString()});save();drawInventory()}function wasteLot(id){const l=db.lots.find(x=>x.id===id),v=n(document.getElementById('waste-'+id).value);if(!l||v<=0||v>remaining(l))return alert('จำนวนไม่ถูกต้อง');if(!confirm('ตัดวัตถุดิบออกจากคลัง '+num(v)+' หน่วย?'))return;l.used+=v;save();drawInventory()}function drawCatalog(){let filtered=db.foods.filter(f=>selectedGroup==='ทั้งหมด'||f.group===selectedGroup);document.getElementById('catalog').innerHTML=`<h2>ฐานข้อมูลวัตถุดิบ</h2><div class="chips">${['ทั้งหมด',...groups].map(g=>`<button class="chip ${g===selectedGroup?'active':''}" data-group="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="list">${filtered.map(f=>`<div class="item"><div class="row"><strong>${esc(f.name)}</strong><span class="pill">${num(stock(f.id))} ${esc(f.unit)}</span></div><div class="sub">ต่อ ${num(f.base)} ${esc(f.unit)} · ${num(f.k)} kcal · โปรตีน ${num(f.p)}g · คาร์บ ${num(f.c)}g · ไขมัน ${num(f.f)}g</div></div>`).join('')}</div><div class="card"><strong>เพิ่มวัตถุดิบใหม่</strong><label>ชื่อ</label><input id="newName" placeholder="เช่น เนื้อวัวส่วนริบอาย"><label>หมวดหมู่</label><select id="newGroup">${groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><label>หน่วย</label><select id="newUnit"><option value="g">กรัม (g)</option><option value="ฟอง">ฟอง</option><option value="ml">มิลลิลิตร (ml)</option><option value="ชิ้น">ชิ้น</option></select><label>ค่าข้อมูลสารอาหารต่อปริมาณ</label><input id="newBase" type="number" value="100" min="0.01" step="any"><div class="grid">${[['k','แคลอรี (kcal)'],['p','โปรตีน (g)'],['c','คาร์บ (g)'],['f','ไขมัน (g)']].map(([k,label])=>`<div><label>${label}</label><input id="new${k}" type="number" value="0" min="0" step="any"></div>`).join('')}</div><button class="btn full" style="margin-top:12px" onclick="addFood()">+ เพิ่มเข้าฐานข้อมูล</button></div><div class="notice">ค่าทางโภชนาการตั้งต้นเป็นค่าประมาณ โปรดตรวจสอบฉลากหรือฐานข้อมูลอาหารก่อนใช้งานจริง โดยเฉพาะเนื้อดรายเอจ</div>`;document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{selectedGroup=b.dataset.group;drawCatalog()})}function addFood(){const name=document.getElementById('newName').value.trim(),base=n(document.getElementById('newBase').value);let values={};for(let k of ['k','p','c','f'])values[k]=n(document.getElementById('new'+k).value);if(!name||base<=0||Object.values(values).some(v=>v<0||!Number.isFinite(v)))return alert('กรุณากรอกข้อมูลให้ถูกต้อง');db.foods.push({id:uid(),name,group:document.getElementById('newGroup').value,unit:document.getElementById('newUnit').value,base,...values});save();drawCatalog()}function drawSettings(){document.getElementById('settings').innerHTML=`<h2>ตั้งค่าและสำรองข้อมูล</h2><div class="card"><strong>เป้าหมายสารอาหารต่อวัน</strong><div class="grid">${[['k','แคลอรี (kcal)'],['p','โปรตีน (g)'],['c','คาร์บ (g)'],['f','ไขมัน (g)']].map(([k,label])=>`<div><label>${label}</label><input id="goal${k}" type="number" min="0" value="${db.goals[k]}"></div>`).join('')}</div><button class="btn full" style="margin-top:12px" onclick="saveGoals()">บันทึกเป้าหมาย</button></div><div class="card"><strong>สำรองข้อมูล</strong><p class="muted">ดาวน์โหลดไฟล์ JSON ไปเก็บในแอป Files หรือ iCloud Drive เพื่อป้องกันข้อมูลหายเมื่อ Safari ล้างข้อมูลเว็บไซต์</p><button class="btn full" onclick="exportData()">⬇ ส่งออกไฟล์สำรอง</button><label>นำเข้าไฟล์สำรอง (แทนที่ข้อมูลปัจจุบันทั้งหมด)</label><input type="file" id="importFile" accept="application/json,.json" onchange="importData(this)"></div><div class="notice">แอปนี้เก็บข้อมูลไว้ในเบราว์เซอร์ของเครื่องเดียว ไม่มีระบบซิงก์หรือบัญชีผู้ใช้ หากล้างข้อมูล Safari ข้อมูลอาจสูญหาย กรุณาสำรองข้อมูลเป็นระยะ</div><div class="card"><strong>วิธีติดตั้งบน iPhone</strong><p class="muted">เมื่อแอปถูกเผยแพร่ผ่าน HTTPS ให้เปิดใน Safari → กด Share → Add to Home Screen เพื่อเพิ่มไอคอนบนหน้าจอ</p></div>`}function saveGoals(){for(let k of ['k','p','c','f']){let v=n(document.getElementById('goal'+k).value);if(!Number.isFinite(v)||v<0)return alert('เป้าหมายไม่ถูกต้อง');db.goals[k]=v}save();alert('บันทึกเป้าหมายแล้ว')}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nutricost-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(el){const f=el.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.foods)||!Array.isArray(obj.lots)||!Array.isArray(obj.meals)||!obj.goals||!obj.foods.every(x=>x.id&&x.name&&x.base>0)||!obj.lots.every(x=>x.id&&x.foodId&&x.qty>0&&x.price>=0&&x.used>=0&&x.used<=x.qty))throw Error('รูปแบบไฟล์ไม่ถูกต้อง');if(!confirm('แทนที่ข้อมูลทั้งหมดด้วยไฟล์สำรองนี้?'))return;db=obj;save();show('dashboard');alert('นำเข้าข้อมูลสำเร็จ')}catch(e){alert('นำเข้าไม่สำเร็จ: '+e.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});show('dashboard');
</script><script>
(function(){
 const K='nutricost.preview.appearance.v2';
 const defaults={theme:'forest',accent:'#6be3b3',font:'ibm',compact:false};

 a.querySelectorAll('button').forEach(b=>b.onclick=()=>{pref.accent=b.dataset.accent;apply();o.remove();open()});
 o.querySelector('#nc-font').value=pref.font;o.querySelector('#nc-font').onchange=e=>{pref.font=e.target.value;apply()};

<script>
(function(){
const FKEY='nutricost.preview.favorites.v2';
function favs(){try{return JSON.parse(localStorage.getItem(FKEY)||'[]')}catch(e){return []}}
function putFavs(x){try{localStorage.setItem(FKEY,JSON.stringify(x))}catch(e){alert('บันทึกรายการโปรดไม่สำเร็จ')}}
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function aggregate(meals){let cost=0,k=0,p=0,c=0,f=0;for(const m of meals){for(const l of m.lines||[]){cost+=Number(l.cost)||0;const item=food(l.foodId);if(!item||!Number(item.base))continue;let factor=Number(l.qty)/Number(item.base);k+=factor*Number(item.k||0);p+=factor*Number(item.p||0);c+=factor*Number(item.c||0);f+=factor*Number(item.f||0)}}return {cost,k,p,c,f}}
let period='week';
function stats(){
const el=document.getElementById('nc-stats');if(!el)return;
const now=new Date(),days=period==='week'?7:30,items=[];
for(let i=days-1;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),key=dateKey(d);let meals=db.meals.filter(m=>m.date===key);items.push({key,label:days===7?d.toLocaleDateString('th-TH',{weekday:'short'}):String(d.getDate()),...aggregate(meals),count:meals.length})}
const sum=items.reduce((a,x)=>({cost:a.cost+x.cost,k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f,count:a.count+x.count}),{cost:0,k:0,p:0,c:0,f:0,count:0});
const max=Math.max(1,...items.map(x=>x.cost));const display=days===7?items:items.filter((_,i)=>i%3===0||i===29);
el.innerHTML='<div class="card"><div class="nc-stat-head"><strong>สถิติการกินและค่าอาหาร</strong><select id="nc-period" aria-label="ช่วงเวลาสถิติ"><option value="week">7 วันล่าสุด</option><option value="month">30 วันล่าสุด</option></select></div><div class="nc-kpis" style="margin-top:16px"><div class="nc-kpi"><small>ค่าอาหารรวม</small><b>'+money(sum.cost)+'</b></div><div class="nc-kpi"><small>เฉลี่ยต่อวัน</small><b>'+money(sum.cost/days)+'</b></div><div class="nc-kpi"><small>แคลอรีเฉลี่ย/วัน</small><b>'+num(sum.k/days)+'</b></div><div class="nc-kpi"><small>จำนวนมื้อ</small><b>'+sum.count+'</b></div></div><div class="muted" style="margin-top:18px">ค่าอาหารรายวัน (บาท)</div><div class="nc-bars">'+display.map(x=>'<div class="nc-bar-col" title="'+x.key+': '+money(x.cost)+'"><div class="nc-bar" style="height:'+Math.max(3,x.cost/max*116)+'px"></div><small>'+x.label+'</small></div>').join('')+'</div><div class="sub" style="margin-top:12px">โปรตีนเฉลี่ย '+num(sum.p/days)+'g · คาร์บ '+num(sum.c/days)+'g · ไขมัน '+num(sum.f/days)+'g / วัน</div><div class="sub">ข้อมูลจากมื้อที่บันทึกจริง ไม่มีการสมมติยอดใช้จ่าย</div></div>';
const select=document.getElementById('nc-period');select.value=period;select.onchange=e=>{period=e.target.value;stats()};
}
function favorites(){
const el=document.getElementById('nc-favorites');if(!el)return;
let data=favs();el.innerHTML='<h2>รายการโปรด ⭐</h2><div class="card"><div class="muted">บันทึกชุดวัตถุดิบจากมื้อที่เคยกิน แล้วเพิ่มซ้ำได้ทันที</div><div class="list" style="margin-top:12px">'+(data.length?data.map((x,i)=>'<div class="item nc-fav-row"><div><strong>'+esc(x.name)+'</strong><div class="sub">'+x.lines.length+' วัตถุดิบ</div></div><div class="actions"><button class="btn small" data-load="'+i+'">เลือก</button><button class="btn danger small" data-remove="'+i+'">ลบ</button></div></div>').join(''):'<div class="empty">ยังไม่มีรายการโปรด</div>')+'</div></div>';
el.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const x=favs()[Number(b.dataset.load)];if(!x)return;const req={};for(const l of x.lines)req[l.foodId]=(req[l.foodId]||0)+Number(l.qty);const missing=Object.entries(req).filter(([id,q])=>!food(id)||stock(id)+1e-7<q);if(missing.length)return alert('สต็อกไม่เพียงพอ: '+missing.map(([id])=>food(id)?.name||'วัตถุดิบที่ถูกลบ').join(', '));draft=x.lines.map(l=>({foodId:l.foodId,qty:Number(l.qty)}));mealName=x.name;show('meals');window.scrollTo(0,0)});
el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!confirm('ลบรายการโปรดนี้?'))return;let a=favs();a.splice(Number(b.dataset.remove),1);putFavs(a);favorites()});
}
function saveFavorite(id){const m=db.meals.find(x=>x.id===id);if(!m)return;let a=favs();a.push({id:Date.now()+Math.random(),name:m.name,lines:m.lines.map(l=>({foodId:l.foodId,qty:l.qty}))});putFavs(a);alert('เพิ่มลงรายการโปรดแล้ว');favorites()}
window.ncSaveFavorite=saveFavorite;
const oldDashboard=drawDashboard;drawDashboard=function(){oldDashboard();const el=document.getElementById('dashboard');if(!document.getElementById('nc-stats')){el.insertAdjacentHTML('beforeend','<div id="nc-stats"></div><div id="nc-favorites"></div>')}stats();favorites()};
const oldMeals=drawMeals;drawMeals=function(){oldMeals();const container=document.getElementById('meals');container.querySelectorAll('button[onclick^="deleteMeal("]').forEach(b=>{const match=b.getAttribute('onclick').match(/deleteMeal\('([^']+)'\)/);if(!match)return;const id=match[1];if(b.parentElement.querySelector('.nc-fav'))return;const star=document.createElement('button');star.className='btn secondary small nc-fav';star.textContent='☆ โปรด';star.onclick=()=>saveFavorite(id);b.parentElement.insertBefore(star,b)})};
})();
</script>

 previousInventory();

<script>
(function(){
const units=[['g','กรัม'],['kg','กิโลกรัม'],['ฟอง','ฟอง'],['ml','มิลลิลิตร'],['L','ลิตร'],['ชิ้น','ชิ้น'],['ลูก','ลูก'],['ช้อนชา','ช้อนชา']];
function ratio(f,from){if(!f)return null;if(from===f.unit)return 1;if(from==='kg'&&f.unit==='g')return 1000;if(from==='g'&&f.unit==='kg')return .001;if(from==='L'&&f.unit==='ml')return 1000;if(from==='ml'&&f.unit==='L')return .001;const grams=Number(f.gramsPerUnit);if(grams>0){if(from==='g'&&f.unit==='ฟอง')return 1/grams;if(from==='ฟอง'&&f.unit==='g')return grams;if(from==='kg'&&f.unit==='ฟอง')return 1000/grams;if(from==='ฟอง'&&f.unit==='kg')return grams/1000}return null}
function converter(inputId,selectId,mode){
 const input=document.getElementById(inputId),sel=document.getElementById(selectId);if(!input||!sel)return;
 const line=document.createElement('div');line.className='nc-extra-card';
 line.innerHTML='<div class="nc-extra-title">🔁 หน่วยที่กรอก</div><div class="nc-extra-row"><select class="nc-convert-unit"></select><span class="nc-extra-small nc-convert-note"></span></div>';
 const anchor=input.closest('.nc-quantity-unit')||input;anchor.after(line);
 const pick=line.querySelector('select'),note=line.querySelector('.nc-convert-note');
 function refresh(){const f=food(sel.value);if(!f)return;const prev=pick.value;pick.innerHTML=units.filter(x=>ratio(f,x[0])!==null).map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');pick.value=Array.from(pick.options).some(x=>x.value===prev)?prev:f.unit;note.textContent=pick.value===f.unit?'บันทึกเป็น '+f.unit:'แปลงเป็น '+f.unit}
 sel.addEventListener('change',refresh);pick.addEventListener('change',refreshNote);input.addEventListener('input',refreshNote);refresh();function refreshNote(){const f=food(sel.value),mult=ratio(f,pick.value),v=Number(input.value);note.textContent=f&&mult!==null&&input.value!==''&&v>0?'≈ '+num(v*mult)+' '+f.unit+' ในคลัง':'บันทึกเป็น '+(f?.unit||'หน่วย')}refreshNote();
 // Core functions read the original quantity input, so temporarily normalize before submit.
 const action=mode==='meal'?'addDraft':'addLot',original=window[action];
 if(typeof original==='function'&&!window['ncWrapped'+action]){
 window['ncWrapped'+action]=true;
 window[action]=function(){const selected=document.querySelector(mode==='meal'?'#meals .nc-convert-unit':'#inventory .nc-convert-unit');const quantity=document.getElementById(inputId),chosen=food(document.getElementById(selectId)?.value);
 if(!selected||!quantity||!chosen)return original.apply(this,arguments);
 const mult=ratio(chosen,selected.value);if(mult===null)return alert('หน่วยนี้ยังแปลงไม่ได้ กรุณาตั้งค่าน้ำหนักต่อหน่วย');
 const raw=quantity.value,amount=Number(raw);if(!raw.trim()||!Number.isFinite(amount)||amount<=0)return alert('กรุณากรอกปริมาณมากกว่า 0');
 const normalized=amount*mult;if(!Number.isFinite(normalized)||normalized<=0)return alert('ปริมาณที่แปลงไม่ถูกต้อง');
 quantity.value=String(normalized);
 try{return original.apply(this,arguments)}finally{if(quantity.isConnected)quantity.value=raw}
 };
 }
}

drawDashboard=function(){
 prevDashboard();

 cards.forEach((card,i)=>{const name=['มื้อ 1','มื้อ 2','มื้อ 3'][i],lines=meals.filter(m=>m.name===name).flatMap(m=>m.lines),t=totals(lines);

 });
 const lines=meals.flatMap(m=>m.lines),missing=lines.filter(l=>{const f=food(l.foodId);return f&&(f.sugar==null||f.sodium==null||f.fiber==null)}).length;
 if(missing){const notice=document.createElement('div');notice.className='nc-extra-card nc-extra-alert nc-extra-small';notice.textContent='🧂 มี '+missing+' รายการที่ข้อมูลน้ำตาล โซเดียม หรือใยอาหารยังไม่ครบ ยอดรวมส่วนนี้อาจต่ำกว่าจริง';root.appendChild(notice)}
};
const prevSettings=drawSettings;
drawSettings=function(){
 prevSettings();const root=document.getElementById('settings');if(!root)return;
 const card=document.createElement('div');card.className='nc-extra-card';
 card.innerHTML='<div class="nc-extra-title">🍱 เมนูที่บันทึกไว้</div><div class="nc-extra-small">เลือกเมนูที่เคยกินเพื่อเพิ่มรายการเดิมได้รวดเร็ว โดยตรวจสอบสต็อกอีกครั้งก่อนบันทึก</div><div id="nc-repeat-meals"></div>';
 const holder=card.querySelector('#nc-repeat-meals');
 const seen=new Set();
 for(const m of db.meals.slice().reverse()){const key=m.name+'|'+m.lines.map(l=>l.foodId+':'+l.qty).join(',');if(seen.has(key))continue;seen.add(key);const b=document.createElement('button');b.className='nc-extra-button';b.style.margin='7px 7px 0 0';b.textContent='🍽️ '+m.name+' ('+m.lines.length+' รายการ)';b.onclick=()=>{draft=m.lines.map(l=>({foodId:l.foodId,qty:l.qty}));mealName=m.name;mealDate=localDate();show('meals')};holder.appendChild(b);if(seen.size>=12)break}
 if(!seen.size)holder.innerHTML='<p class="nc-extra-small">ยังไม่มีมื้ออาหารที่บันทึกไว้</p>';
 root.prepend(card);
};
})();
</script>

<style>
.nc-edit-panel{margin:12px 0;padding:16px;border:1px solid var(--nc-border);border-radius:19px;background:var(--nc-panel)}
.nc-edit-panel label{display:block;font-size:12px;margin:10px 0 5px;color:var(--nc-muted)}
.nc-edit-panel input,.nc-edit-panel select{width:100%;min-height:43px;border-radius:12px}
.nc-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.nc-edit-btn{border:1px solid var(--nc-border);border-radius:12px;padding:7px 11px;background:var(--nc-panel2);color:var(--nc-text);font-size:12px}
.nc-edit-save{border:0;background:#7863eb;color:white;border-radius:12px;padding:12px 15px;font-weight:700}
</style>
<script>
(function(){
let editingId=null;
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=(arr,value)=>arr.map(x=>'<option value="'+safe(x)+'" '+(x===value?'selected':'')+'>'+safe(x)+'</option>').join('');
const mainGroups=['โปรตีน','คาร์โบไฮเดรต','วิตามิน','ผลไม้','ไขมัน','เครื่องปรุง','อื่น ๆ'];
const units=['g','kg','ฟอง','ml','L','ชิ้น','ลูก','ช้อนชา'];
function used(f){return db.lots.some(l=>l.foodId===f.id)||db.meals.some(m=>m.lines.some(l=>l.foodId===f.id))}
function editor(f){
 const locked=used(f);
 return '<div class="nc-edit-panel" id="nc-edit-panel"><strong>✏️ แก้ไข '+safe(f.name)+'</strong>'+
 '<label>ชื่อวัตถุดิบ</label><input id="nc-edit-name" maxlength="100" value="'+safe(f.name)+'">'+
 '<div class="nc-edit-grid"><div><label>หมู่หลัก</label><select id="nc-edit-main">'+options(mainGroups,f.mainGroup||'อื่น ๆ')+'</select></div><div><label>หมวดย่อย</label><input id="nc-edit-group" maxlength="70" value="'+safe(f.group)+'"></div></div>'+
 '<div class="nc-edit-grid"><div><label>หน่วยบันทึก</label><select id="nc-edit-unit" '+(locked?'disabled':'')+'>'+options(units,f.unit)+'</select></div><div><label>ปริมาณอ้างอิง</label><input id="nc-edit-base" type="number" min="0.01" step="any" value="'+safe(f.base)+'"></div></div>'+
 (locked?'<p class="nc-extra-small">🔒 หน่วยถูกล็อก เพราะมีประวัติการซื้อหรือมื้ออาหารแล้ว เพื่อป้องกันข้อมูลสต็อกและต้นทุนผิดพลาด</p>':'')+
 '<div class="nc-edit-grid">'+[['k','🔥 แคลอรี (kcal)'],['p','💪 โปรตีน (กรัม)'],['c','🍚 คาร์บ (กรัม)'],['f','🥑 ไขมัน (กรัม)'],['sugar','🍬 น้ำตาล (กรัม)'],['sodium','🧂 โซเดียม (มก.)'],['fiber','🥦 ใยอาหาร (กรัม)'],['gramsPerUnit','⚖️ กรัมต่อหน่วย']].map(([key,label])=>'<div><label>'+label+'</label><input id="nc-edit-'+key+'" type="number" min="0" step="any" placeholder="ไม่ทราบ" value="'+safe(f[key]??'')+'"></div>').join('')+'</div>'+
 '<p class="nc-extra-small">ช่องน้ำตาล โซเดียม และใยอาหารที่เว้นว่าง = ยังไม่มีข้อมูล ไม่ใช่ศูนย์</p>'+
 '<div class="nc-extra-row"><button type="button" class="nc-edit-save" onclick="ncSaveIngredient()">💾 บันทึกการแก้ไข</button><button type="button" class="nc-edit-btn" onclick="ncCloseIngredient()">ยกเลิก</button></div></div>';
}
const old=drawCatalog;
drawCatalog=function(){
 old();
 const root=document.getElementById('catalog'),list=root?.querySelector('.list');if(!list)return;
 const cards=Array.from(list.children);
 // Match the actual rendered catalog order (may be filtered by main group).
 cards.forEach(card=>{
 const title=card.querySelector('strong')?.textContent;
 const f=db.foods.find(x=>x.name===title);
 if(!f)return;
 const b=document.createElement('button');b.type='button';b.className='nc-edit-btn';b.textContent='✏️ แก้ไข';b.onclick=()=>{editingId=f.id;drawCatalog();document.getElementById('nc-edit-panel')?.scrollIntoView({block:'nearest',behavior:'smooth'})};
 card.appendChild(b);
 });
 if(editingId){const f=db.foods.find(x=>x.id===editingId);if(f){const node=document.createElement('div');node.innerHTML=editor(f);list.before(node)}}
};
window.ncCloseIngredient=function(){editingId=null;drawCatalog()};
window.ncSaveIngredient=function(){
 const f=db.foods.find(x=>x.id===editingId);if(!f)return;
 const get=k=>document.getElementById('nc-edit-'+k)?.value;
 const name=(get('name')||'').trim(),group=(get('group')||'').trim(),main=get('main'),base=Number(get('base'));
 if(!name||!group||!Number.isFinite(base)||base<=0)return alert('กรุณากรอกชื่อ หมวดหมู่ และปริมาณอ้างอิงให้ถูกต้อง');
 if(db.foods.some(x=>x.id!==f.id&&x.name===name))return alert('มีชื่อวัตถุดิบนี้อยู่แล้ว');
 const changes={name,group,mainGroup:main,base};
 if(!used(f))changes.unit=get('unit');
 for(const key of ['k','p','c','f','sugar','sodium','fiber','gramsPerUnit']){
 const raw=get(key);if(raw==null)continue;
 if(raw===''){if(['k','p','c','f'].includes(key))return alert('กรุณากรอกสารอาหารหลักให้ครบ');changes[key]=undefined;continue}
 const v=Number(raw);if(!Number.isFinite(v)||v<0||(key==='gramsPerUnit'&&v===0))return alert('ตัวเลขสารอาหารไม่ถูกต้อง: '+key);
 changes[key]=v;
 }
 Object.assign(f,changes);save();editingId=null;drawCatalog();alert('บันทึกข้อมูลวัตถุดิบแล้ว');
};
})();
</script>

<style>
.nc-catalog-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 16px}
.nc-catalog-top h2{margin:0}

.nc-catalog-editor-wrap{margin:0 0 15px}
</style>
<script>
(function(){
let createOpen=false,editorOpen=false;
const previous=drawCatalog;
drawCatalog=function(){
 previous();
 const root=document.getElementById('catalog');if(!root)return;
 const list=root.querySelector('.list'),nameField=root.querySelector('#newName'),form=nameField?.closest('.card');
 if(!list||!form)return;
 const header=document.createElement('div');header.className='nc-catalog-top';
 header.innerHTML='<h2>🥗 วัตถุดิบของฉัน</h2><button type="button" class="nc-catalog-add" id="nc-open-create">＋ เพิ่มวัตถุดิบ</button>';
 const oldHeading=root.querySelector('h2');if(oldHeading)oldHeading.remove();
 root.prepend(header);
 const drawer=document.createElement('section');drawer.className='nc-catalog-create'+(createOpen?' open':'');drawer.id='nc-create-drawer';
 form.before(drawer);drawer.appendChild(form);
 const close=document.createElement('button');close.type='button';close.className='nc-catalog-edit';close.textContent='✕ ปิดแบบฟอร์ม';close.onclick=()=>{createOpen=false;drawer.classList.remove('open')};form.prepend(close);
 header.querySelector('button').onclick=()=>{createOpen=!createOpen;drawer.classList.toggle('open',createOpen);if(createOpen)drawer.scrollIntoView({behavior:'smooth',block:'start'})};
 // Make editing discoverable on every ingredient row, independently of earlier wrappers.
 Array.from(list.querySelectorAll('.item')).forEach(card=>{
 const name=card.querySelector('strong')?.textContent?.trim();
 const ingredient=db.foods.find(f=>f.name===name);
 if(!ingredient)return;
 const originalEdit=card.querySelector('.nc-edit-btn');const openEditor=originalEdit?.onclick;card.querySelectorAll('.nc-edit-btn').forEach(b=>b.remove());
 const btn=document.createElement('button');btn.type='button';btn.className='nc-catalog-edit';btn.textContent='✏️ แก้ไขข้อมูล';
 btn.onclick=()=>{
   // Existing editor uses the closure-scoped selected ID; activate its original handler via the prior render.
   if(openEditor)openEditor();else alert('กรุณาลองเปิดหน้านี้ใหม่อีกครั้ง');
 };
 card.appendChild(btn);
 });
 // Existing editor wrapper's buttons are replaced above; keep a working edit trigger
 // by capturing the original handlers before removal in the next pass.
};
})();
</script>

<script>
(function(){
 // Preview-safe catalog entrypoint, independent of legacy wrapper order.
 const oldRenderCatalog=drawCatalog;
 drawCatalog=function(){
 oldRenderCatalog();
 const root=document.getElementById('catalog');
 if(!root)return;
 const header=root.querySelector('.nc-catalog-top');

 root.prepend(bar);form.style.display='none';
 bar.querySelector('button').onclick=()=>{form.style.display=form.style.display==='none'?'block':'none'};

 };

<script>
(function(){
let active=null;
function modal(){
 let layer=document.getElementById('nc-manage-modal');if(layer)return layer;
 layer=document.createElement('div');layer.id='nc-manage-modal';layer.className='nc-modal-layer';layer.hidden=true;
 layer.innerHTML='<div class="nc-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="nc-modal-heading"><div class="nc-modal-head"><strong id="nc-modal-heading"></strong><button type="button" class="nc-modal-close">✕ ปิด</button></div><div class="nc-modal-body"></div></div>';
 document.body.appendChild(layer);
 layer.querySelector('.nc-modal-close').onclick=close;
 layer.addEventListener('click',e=>{if(e.target===layer)close()});
 return layer;
}
function close(){
 const layer=modal();layer.hidden=true;
 // Close without modifying saved data; original catalog render recreates the form.
 active=null;drawCatalog();
}
function open(title){
 const layer=modal();layer.querySelector('#nc-modal-heading').textContent=title;layer.hidden=false;
 return layer.querySelector('.nc-modal-body');
}
function openCreate(){
 const root=document.getElementById('catalog'),form=root.querySelector('#newName')?.closest('.card');
 if(!form)return;
 const body=open('➕ เพิ่มวัตถุดิบใหม่');body.replaceChildren(form);
 form.style.display='block';form.querySelectorAll('.nc-catalog-edit').forEach(b=>b.remove());
 active='create';
}
function openEdit(){
 const root=document.getElementById('catalog'),list=root.querySelector('.list');
 if(!list)return;
 const body=open('✏️ แก้ไขวัตถุดิบ');
 body.innerHTML='<label>เลือกวัตถุดิบที่ต้องการแก้ไข</label><select class="nc-manage-picker" id="nc-manage-food"></select><div id="nc-manage-edit-body"></div>';
 const picker=body.querySelector('select');
 const foods=db.foods.slice().sort((a,b)=>a.name.localeCompare(b.name,'th'));
 for(const f of foods){const option=document.createElement('option');option.value=f.id;option.textContent=f.name;picker.appendChild(option)}
 function selectFood(){
  const f=db.foods.find(x=>x.id===picker.value);if(!f)return;
  // Trigger existing editor through its original handler in a freshly rendered catalog.
  const oldButton=Array.from(root.querySelectorAll('.item')).find(el=>el.querySelector('strong')?.textContent?.trim()===f.name)?.querySelector('.nc-catalog-edit');
  if(oldButton&&oldButton.onclick){oldButton.onclick();const editor=root.querySelector('#nc-edit-panel');if(editor){body.querySelector('#nc-manage-edit-body')?.replaceChildren(editor);editor.style.display='block';editor.querySelectorAll('.nc-edit-btn').forEach(b=>b.style.display='inline-block')}}
 }
 picker.onchange=()=>{drawCatalog();selectFood()};
 if(foods.length)selectFood();else body.insertAdjacentText('beforeend','ยังไม่มีวัตถุดิบ');
 active='edit';
}
const previous=drawCatalog;
drawCatalog=function(){
 previous();
 const root=document.getElementById('catalog');if(!root)return;
 root.querySelectorAll('.nc-catalog-top .nc-catalog-add,#nc-fallback-create').forEach(b=>b.remove());
 const header=root.querySelector('.nc-catalog-top');
 if(!header)return;
 const menu=document.createElement('div');menu.className='nc-manage-menu';
 menu.innerHTML='<button type="button" class="nc-manage-trigger" aria-expanded="false">＋ จัดการวัตถุดิบ ▾</button><div class="nc-manage-options" hidden><button type="button" data-action="add">➕ เพิ่มวัตถุดิบใหม่</button><button type="button" data-action="edit">✏️ แก้ไขวัตถุดิบ</button></div>';
 header.appendChild(menu);
 const trigger=menu.querySelector('.nc-manage-trigger'),options=menu.querySelector('.nc-manage-options');
 trigger.onclick=()=>{options.hidden=!options.hidden;trigger.setAttribute('aria-expanded',String(!options.hidden))};
 options.querySelector('[data-action="add"]').onclick=()=>{options.hidden=true;openCreate()};
 options.querySelector('[data-action="edit"]').onclick=()=>{options.hidden=true;openEdit()};
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal().hidden)close()});
})();
</script>

<style>
.nc-delete-action{color:#ef7777!important}
.nc-delete-hint{font-size:12px;color:var(--nc-muted);line-height:1.7;margin:9px 0 15px}

.nc-delete-select{width:100%;min-height:48px;margin:10px 0}
</style>
<script>
(function(){
const previous=drawCatalog;
drawCatalog=function(){
 previous();
 const menu=document.querySelector('#catalog .nc-manage-options');if(!menu)return;
 const action=document.createElement('button');action.type='button';action.className='nc-delete-action';action.textContent='🗑️ ลบวัตถุดิบ';menu.appendChild(action);
 action.onclick=()=>{
 menu.hidden=true;
 let modal=document.getElementById('nc-manage-modal');
 if(!modal){
 modal=document.createElement('div');modal.id='nc-manage-modal';modal.className='nc-modal-layer';modal.hidden=true;
 modal.innerHTML='<div class="nc-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="nc-modal-heading"><div class="nc-modal-head"><strong id="nc-modal-heading"></strong><button type="button" class="nc-modal-close">✕ ปิด</button></div><div class="nc-modal-body"></div></div>';
 document.body.appendChild(modal);
 modal.querySelector('.nc-modal-close').onclick=()=>{modal.hidden=true;drawCatalog()};
 modal.addEventListener('click',e=>{if(e.target===modal){modal.hidden=true;drawCatalog()}});
 }
 const title=modal.querySelector('#nc-modal-heading'),body=modal.querySelector('.nc-modal-body');
 title.textContent='🗑️ ลบวัตถุดิบ';modal.hidden=false;
 body.replaceChildren();
 const label=document.createElement('label');label.textContent='เลือกวัตถุดิบที่ต้องการลบ';body.appendChild(label);
 const select=document.createElement('select');select.className='nc-delete-select';body.appendChild(select);
 const foods=db.foods.slice().sort((a,b)=>a.name.localeCompare(b.name,'th'));
 for(const f of foods){const opt=document.createElement('option');opt.value=f.id;opt.textContent=f.name;select.appendChild(opt)}
 const hint=document.createElement('p');hint.className='nc-delete-hint';body.appendChild(hint);
 const del=document.createElement('button');del.type='button';del.className='nc-delete-danger';del.textContent='ลบวัตถุดิบนี้';body.appendChild(del);
 function inspect(){
 const id=select.value;
 const lots=db.lots.filter(l=>l.foodId===id);
 const mealCount=db.meals.reduce((sum,m)=>sum+m.lines.filter(l=>l.foodId===id).length,0);
 const draftCount=Array.isArray(draft)?draft.filter(l=>l.foodId===id).length:0;
 const blocked=lots.length>0||mealCount>0||draftCount>0;
 del.disabled=!id||blocked;
 hint.textContent=!id?'ไม่มีวัตถุดิบให้ลบ':blocked?'🔒 ยังลบไม่ได้ เพราะมีข้อมูลอ้างอิงอยู่ ('+lots.length+' ล็อตซื้อ, '+mealCount+' รายการมื้ออาหาร'+(draftCount?', '+draftCount+' รายการที่ยังไม่บันทึก':'')+') เพื่อป้องกันประวัติ ต้นทุน และสต็อกเสียหาย':'การลบจะนำวัตถุดิบออกจากรายการของคุณ และไม่สามารถย้อนกลับได้';
 }
 select.onchange=inspect;inspect();
 del.onclick=()=>{
 const id=select.value,f=db.foods.find(x=>x.id===id);if(!f)return;
 const hasLinks=db.lots.some(l=>l.foodId===id)||db.meals.some(m=>m.lines.some(l=>l.foodId===id))||(Array.isArray(draft)&&draft.some(l=>l.foodId===id));
 if(hasLinks){inspect();return}
 if(!confirm('ยืนยันลบวัตถุดิบ "'+f.name+'"?\nการดำเนินการนี้ย้อนกลับไม่ได้'))return;
 db.foods=db.foods.filter(x=>x.id!==id);save();modal.hidden=true;drawCatalog();
 };
 };
};
})();
</script>
